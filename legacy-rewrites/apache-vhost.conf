# CAPUBBS legacy forum route handoff.
# Generated from routes.json. Run npm --prefix bbs-new/app run generate:legacy-rewrites.
# Put these rules in the site vhost or root .htaccess before legacy PHP handling.

RewriteEngine On

RewriteRule ^/?bbs/register(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/register [QSA,L]
RewriteRule ^/?bbs/home(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/home [QSA,L]
RewriteRule ^/?bbs/home/information\.php$ /capubbs-new/?legacyPath=/bbs/home/information.php [QSA,L]
RewriteRule ^/?bbs/home/message\.php$ /capubbs-new/?legacyPath=/bbs/home/message.php [QSA,L]
RewriteRule ^/?bbs/home/security\.php$ /capubbs-new/?legacyPath=/bbs/home/security.php [QSA,L]
RewriteCond %{QUERY_STRING} !(^|&)action=
RewriteRule ^/?bbs/favorite(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/favorite [QSA,L]
RewriteRule ^/?bbs/editpid(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/editpid [QSA,L]
RewriteRule ^/?bbs/manage/post_activity(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/manage/post_activity [QSA,L]
RewriteRule ^/?bbs/online(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/online [QSA,L]
RewriteRule ^/?bbs/sign(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/bbs/sign [QSA,L]
RewriteRule ^/?cgi-bin/main\.pl$ /capubbs-new/?legacyPath=/cgi-bin/main.pl [QSA,L]
RewriteRule ^/?cgi-bin/bbs\.pl$ /capubbs-new/?legacyPath=/cgi-bin/bbs.pl [QSA,L]
RewriteRule ^/?bbs-new/index\.php$ /capubbs-new/?legacyPath=/index.php [QSA,L]
RewriteRule ^/?bbs-new/board\.php$ /capubbs-new/?legacyPath=/board.php [QSA,L]
RewriteRule ^/?bbs-new/thread\.php$ /capubbs-new/?legacyPath=/thread.php [QSA,L]
RewriteRule ^/?bbs-new/profile\.php$ /capubbs-new/?legacyPath=/profile.php [QSA,L]
RewriteRule ^/?bbs-new/search\.php$ /capubbs-new/?legacyPath=/search.php [QSA,L]
RewriteRule ^/?bbs-new/login(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/login.php [QSA,L]
RewriteRule ^/?bbs-new/register(?:/?|/index\.php)$ /capubbs-new/?legacyPath=/register.php [QSA,L]
RewriteRule ^/?bbs-new/user-center\.php$ /capubbs-new/?legacyPath=/user-center.php [QSA,L]
RewriteRule ^/?bbs-new/stats\.php$ /capubbs-new/?legacyPath=/stats.php [QSA,L]
RewriteRule ^/?bbs-new/editpid\.php$ /capubbs-new/?legacyPath=/editpid.php [QSA,L]
RewriteRule ^/?bbs-new/activity-post\.php$ /capubbs-new/?legacyPath=/activity-post.php [QSA,L]
