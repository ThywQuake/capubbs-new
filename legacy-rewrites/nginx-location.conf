}

location = /bbs/favorite {
  if ($arg_action = "") {
    rewrite ^ /capubbs-new/?legacyPath=/bbs/favorite last;
  }

  rewrite ^ /bbs/favorite/index.php last;
}

location = /bbs/favorite/ {
  if ($arg_action = "") {
