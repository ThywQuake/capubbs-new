# CAPUBBS legacy forum route handoff.
# Generated from routes.json. Run npm --prefix bbs-new/app run generate:legacy-rewrites.
# Put these locations in the site server block before generic PHP handling.

location = /bbs/register {
  rewrite ^ /capubbs-new/?legacyPath=/bbs/register last;
}

location = /bbs/register/ {
  rewrite ^ /capubbs-new/?legacyPath=/bbs/register last;
}

location = /bbs/register/index.php {
  rewrite ^ /capubbs-new/?legacyPath=/bbs/register last;
}

